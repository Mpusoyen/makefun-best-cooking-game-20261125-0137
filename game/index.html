<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Wok: Night Market Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #170b06; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 0 60px rgba(255, 150, 50, 0.25); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern Wok: Night Market Kitchen — a cooking game. Move with WASD or the arrow keys, press Space or E to pick up ingredients, chop, cook, plate and serve dishes before each order's patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
